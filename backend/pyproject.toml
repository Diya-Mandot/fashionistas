[project]
name = "ecostylist-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "openai>=3.37",
  "pillow-heif>=1.8.1",
  "google-auth>=2.62.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
